plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.2'
	id "org.sonarqube" version "7.5.0.8588"
}

group = 'com.feurle'
version = System.getenv('APP_VERSION') ?: '0.0.0-SNAPSHOT'
description = 'Animal Health Application'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', "2.1.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'de.codecentric:spring-boot-admin-starter-client:4.1.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
	runtimeOnly 'org.springframework.modulith:spring-modulith-observability'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
}

springBoot {
	buildInfo()
}

tasks.named("bootBuildImage") {
	imageName = "docker.io/feurle/${project.name}"
}

// Frontend is built here and served by Spring Boot as static resources —
// see docs/adr/0001-single-container-deployment.md
def frontendDir = file("frontend")
def frontendDist = file("frontend/dist")
def frontendStaticDir = file("src/main/resources/static")

tasks.register("npmInstall", Exec) {
	group = "frontend"
	description = "Installs frontend dependencies via npm ci"
	workingDir = frontendDir
	inputs.file("frontend/package-lock.json")
	outputs.dir("frontend/node_modules")
	commandLine "npm", "ci"
}

tasks.register("buildFrontend", Exec) {
	group = "frontend"
	description = "Builds the React frontend into frontend/dist"
	dependsOn "npmInstall"
	workingDir = frontendDir
	inputs.dir("frontend/src")
	inputs.file("frontend/package.json")
	inputs.file("frontend/vite.config.ts")
	outputs.dir(frontendDist)
	commandLine "npm", "run", "build"
}

tasks.register("syncFrontend", Sync) {
	group = "frontend"
	description = "Copies the built frontend into src/main/resources/static"
	dependsOn "buildFrontend"
	from frontendDist
	into frontendStaticDir
}

tasks.named("processResources") {
	dependsOn "syncFrontend"
}

bootRun {
	args = ["--spring.profiles.active=dev"]
}

tasks.register("devAll") {
	group = "application"
	description = "Starts backend (bootRun) and frontend (vite dev server) in parallel for local development."
	dependsOn("npmInstall")
	notCompatibleWithConfigurationCache("starts long-running child processes")
	doLast {
		def backend = null
		def frontend = null
		def stopAll = {
			backend?.destroyForcibly()
			frontend?.destroyForcibly()
		}
		// A shutdown hook alone is not enough: this task runs inside the
		// persistent Gradle daemon, which stays alive across Ctrl+C. Also hook
		// into buildFinished (fired for this build session even when cancelled)
		// so the child processes never outlive the terminal session.
		Runtime.runtime.addShutdownHook(new Thread(stopAll))
		gradle.buildFinished { stopAll() }
		try {
			backend =
					new ProcessBuilder("./gradlew", "bootRun")
							.directory(projectDir)
							.redirectOutput(ProcessBuilder.Redirect.INHERIT)
							.redirectError(ProcessBuilder.Redirect.INHERIT)
							.start()
			frontend =
					new ProcessBuilder("npm", "run", "dev")
							.directory(frontendDir)
							.redirectOutput(ProcessBuilder.Redirect.INHERIT)
							.redirectError(ProcessBuilder.Redirect.INHERIT)
							.start()

			while (backend.isAlive() && frontend.isAlive()) {
				Thread.sleep(500)
			}
		} finally {
			stopAll()
		}
	}
}

spotless {
	java {
		googleJavaFormat('1.35.0')
		licenseHeader '// SPDX-License-Identifier: MIT\n// Copyright (C) 2026 Daniel Feurle'
	}
}

sonar {
	properties {
		property "sonar.projectKey", "feurle_tg-app"
		property "sonar.organization", "feurle"
		property "sonar.host.url", "https://sonarcloud.io"
		property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
	}
}

bootRun {
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			if (line && !line.startsWith('#')) {
				def (key, value) = line.tokenize('=')
				environment key, value
			}
		}
	}
}