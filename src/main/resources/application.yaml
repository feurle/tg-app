spring:
  application:
    name: tg-app
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true      # STARTTLS statt SSL
      mail.smtp.starttls.required: true    # optional aber empfohlen
      mail.smtp.ssl.enable: false

app:
  mail:
    from: ${MAIL_FROM:Webapp <app@foo.bar>}

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  liquibase:
    contexts: stage
    drop-first: true

---

spring:
  config:
    activate:
      on-profile: stage
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:tg-database}?serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  liquibase:
    drop-first: true
    contexts: stage

