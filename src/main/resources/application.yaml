spring:
  application:
    name: tg-app
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.enable: false
  boot:
    admin:
      client:
        url: http://tg-admin:8080
        instance:
          name: ${spring.application.name}
          # Container name so tg-admin reaches our actuator by Docker hostname, not IP
          service-base-url: ${SERVICE_BASE_URL:http://localhost:8080}
          metadata:
            user.name: ${ADMIN_USERNAME:admin}
            user.password: ${ADMIN_PASSWORD:admin}

app:
  mail:
    from: ${MAIL_FROM:Webapp <app@foo.bar>}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump,heapdump,env,beans,scheduledtasks,modulith
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    loggers:
      enabled: true
    env:
      post:
        enabled: true

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  liquibase:
    contexts: stage
    drop-first: true
  # No tg-admin running locally — disable client to suppress retry noise
  boot:
    admin:
      client:
        enabled: false

---

spring:
  config:
    activate:
      on-profile: stage
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:tg-database}?serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  liquibase:
    drop-first: true
    contexts: stage

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump,heapdump,env,beans,scheduledtasks,modulith,logfile

logging:
  file:
    name: /tmp/tg-app.log
