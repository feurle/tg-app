databaseChangeLog:
  - changeSet:
      id: 001-create-vet-info-table
      author: system
      changes:
        - createTable:
            tableName: vet_info
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  startWith: 1500
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: city
                  type: VARCHAR(100)
              - column:
                  name: zip
                  type: VARCHAR(20)
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP

  - changeSet:
      id: 002-create-vet-office-hour-table
      author: system
      changes:
        - createTable:
            tableName: vet_office_hour
            columns:
              - column:
                  name: vet_info_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: VARCHAR(255)
              - column:
                  name: hours
                  type: VARCHAR(100)
        - addForeignKeyConstraint:
            baseTableName: vet_office_hour
            baseColumnNames: vet_info_id
            referencedTableName: vet_info
            referencedColumnNames: id
            constraintName: fk_office_hour_vet_info
            onDelete: CASCADE

  - changeSet:
      id: 003-add-primary-unique-index-vet-info
      author: system
      dbms: mysql,mariadb
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_one_primary_vet_info
              ON vet_info ((CASE WHEN is_primary = TRUE THEN 1 ELSE NULL END));
