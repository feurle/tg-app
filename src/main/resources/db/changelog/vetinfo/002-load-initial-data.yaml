databaseChangeLog:

  - changeSet:
      id: 005-load-vet-info
      author: system
      context: seed
      changes:
        - loadData:
            tableName: vet_info
            file: db/data/vet_info.csv
            separator: ;
            encoding: UTF-8
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: name
                  type: STRING
              - column:
                  name: phone
                  type: STRING
              - column:
                  name: email
                  type: STRING
              - column:
                  name: street
                  type: STRING
              - column:
                  name: city
                  type: STRING
              - column:
                  name: zip
                  type: STRING
              - column:
                  name: is_primary
                  type: BOOLEAN
              - column:
                  name: updated_at
                  type: datetime

  - changeSet:
      id: 006-load-vet-office-hours
      author: system
      context: seed
      changes:
        - loadData:
            tableName: vet_office_hour
            file: db/data/vet_office_hour.csv
            separator: ;
            encoding: UTF-8
            relativeToChangelogFile: false
            columns:
              - column:
                  name: vet_info_id
                  type: NUMERIC
              - column:
                  name: sort_order
                  type: NUMERIC
              - column:
                  name: day_of_week
                  type: STRING
              - column:
                  name: opens_at
                  type: STRING
              - column:
                  name: closes_at
                  type: STRING
