databaseChangeLog:
  - changeSet:
      id: 001-create-tag-table
      author: system
      changes:
        - createTable:
            tableName: tag
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 002-create-article-tags-table
      author: system
      changes:
        - createTable:
            tableName: article_tags
            columns:
              - column:
                  name: article_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: article_tags
            columnNames: article_id, tag_id
            constraintName: pk_article_tags
        - addForeignKeyConstraint:
            baseTableName: article_tags
            baseColumnNames: article_id
            constraintName: fk_article_tags_article
            referencedTableName: article
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: article_tags
            baseColumnNames: tag_id
            constraintName: fk_article_tags_tag
            referencedTableName: tag
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 003-load-fake-tags
      author: system
      context: faker
      changes:
        - loadData:
            file: db/fake-data/tag.csv
            tableName: tag
            separator: ;
            quotchar: '"'
            columns:
              - column:
                  name: id
                  type: numeric
              - column:
                  name: name
                  type: string

  - changeSet:
      id: 004-load-fake-article-tags
      author: system
      context: faker
      changes:
        - loadData:
            file: db/fake-data/article_tag.csv
            tableName: article_tags
            separator: ;
            quotchar: '"'
            columns:
              - column:
                  name: article_id
                  type: numeric
              - column:
                  name: tag_id
                  type: numeric
