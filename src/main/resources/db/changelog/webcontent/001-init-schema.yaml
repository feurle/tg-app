databaseChangeLog:
  - changeSet:
      id: 001-create-image-table
      author: system
      changes:
        - createTable:
            tableName: image
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  startWith: 1500
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: image_data
                  type: LONGBLOB
              - column:
                  name: file_name
                  type: VARCHAR(255)
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: mime_type
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP

  - changeSet:
      id: 002-create-page-table
      author: system
      changes:
        - createTable:
            tableName: page
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)

  - changeSet:
      id: 003-create-article-table
      author: system
      changes:
        - createTable:
            tableName: article
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  startWith: 1500
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: content
                  type: CLOB
              - column:
                  name: state
                  type: VARCHAR(50)
              - column:
                  name: article_type
                  type: VARCHAR(50)
              - column:
                  name: language
                  type: VARCHAR(50)
                  defaultValue: GERMAN
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: published_date
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: page_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: article
            baseColumnNames: page_id
            constraintName: fk_article_page
            referencedTableName: page
            referencedColumnNames: id
            onDelete: SET NULL

  - changeSet:
      id: 004-create-article-images-table
      author: system
      changes:
        - createTable:
            tableName: article_images
            columns:
              - column:
                  name: article_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: image_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: article_images
            columnNames: article_id, image_id
            constraintName: pk_article_images
        - addForeignKeyConstraint:
            baseTableName: article_images
            baseColumnNames: article_id
            constraintName: fk_article_images_article
            referencedTableName: article
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: article_images
            baseColumnNames: image_id
            constraintName: fk_article_images_image
            referencedTableName: image
            referencedColumnNames: id

  - changeSet:
      id: 005-create-tag-table
      author: system
      changes:
        - createTable:
            tableName: tag
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 006-create-article-tags-table
      author: system
      changes:
        - createTable:
            tableName: article_tags
            columns:
              - column:
                  name: article_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: article_tags
            columnNames: article_id, tag_id
            constraintName: pk_article_tags
        - addForeignKeyConstraint:
            baseTableName: article_tags
            baseColumnNames: article_id
            constraintName: fk_article_tags_article
            referencedTableName: article
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: article_tags
            baseColumnNames: tag_id
            constraintName: fk_article_tags_tag
            referencedTableName: tag
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 007-create-section-table
      author: system
      changes:
        - createTable:
            tableName: section
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: content
                  type: CLOB
              - column:
                  name: article_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: section
            baseColumnNames: article_id
            constraintName: fk_section_article
            referencedTableName: article
            referencedColumnNames: id
            onDelete: CASCADE
