databaseChangeLog:
  - changeSet:
      id: 004-load-fake-images
      author: system
      context: faker
      changes:
        - loadData:
            file: db/fake-data/image.csv
            tableName: image
            separator: ;
            quotchar: '"'
            columns:
              - column:
                  name: id
                  type: numeric
              - column:
                  name: file_name
                  type: string
              - column:
                  name: mime_type
                  type: string
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: image_data
                  type: BLOB