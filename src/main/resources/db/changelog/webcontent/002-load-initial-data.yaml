databaseChangeLog:

  # ── Always: base reference data ──────────────────────────────────────────

  - changeSet:
      id: 001-load-images
      author: system
      changes:
        - loadData:
            file: db/data/image.csv
            tableName: image
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: file_name
                  type: STRING
              - column:
                  name: title
                  type: STRING
              - column:
                  name: mime_type
                  type: STRING
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: image_data
                  type: BLOB

  - changeSet:
      id: 002-load-tags
      author: system
      changes:
        - loadData:
            file: db/data/tag.csv
            tableName: tag
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: name
                  type: STRING

  - changeSet:
      id: 003-load-pages
      author: system
      changes:
        - loadData:
            tableName: page
            file: db/data/page.csv
            separator: ;
            encoding: UTF-8
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: slug
                  type: STRING
              - column:
                  name: title
                  type: STRING
              - column:
                  name: description
                  type: STRING

  # ── Seed: initial articles, sections and image links ─────────────────────

  - changeSet:
      id: 004-load-articles-de
      author: system
      context: seed
      changes:
        - loadData:
            tableName: article
            file: db/data/article_de.csv
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: title
                  type: STRING
              - column:
                  name: content
                  type: STRING
              - column:
                  name: state
                  type: STRING
              - column:
                  name: published_date
                  type: datetime
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: language
                  type: STRING
              - column:
                  name: article_type
                  type: STRING
              - column:
                  name: sort_order
                  type: NUMERIC
              - column:
                  name: page_id
                  type: NUMERIC

  - changeSet:
      id: 005-load-sections-de
      author: system
      context: seed
      changes:
        - loadData:
            tableName: section
            file: db/data/section_de.csv
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: sort_order
                  type: NUMERIC
              - column:
                  name: title
                  type: STRING
              - column:
                  name: content
                  type: STRING
              - column:
                  name: article_id
                  type: NUMERIC

  - changeSet:
      id: 006-load-article-images
      author: system
      context: seed
      changes:
        - loadData:
            tableName: article_images
            file: db/data/article_images.csv
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: article_id
                  type: NUMERIC
              - column:
                  name: image_id
                  type: NUMERIC


