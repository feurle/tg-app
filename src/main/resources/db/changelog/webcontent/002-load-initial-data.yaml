  - changeSet:
      id: 010-assign-fake-article-page-ids
      author: system
      context: faker
      changes:
        - sql: UPDATE article SET page_id = 1 WHERE page_type IN ('HOME_TEASER', 'HOME_PAGE')
        - sql: UPDATE article SET page_id = 2 WHERE page_type IN ('NEWS_TEASER', 'NEWS_PAGE')
        - sql: UPDATE article SET page_id = 3 WHERE page_type IN ('ABOUT_TEASER', 'ABOUT_PAGE')


