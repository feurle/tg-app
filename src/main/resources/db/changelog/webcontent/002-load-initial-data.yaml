databaseChangeLog:

  # ── Always: base reference data ──────────────────────────────────────────

  - changeSet:
      id: 001-load-images
      author: system
      changes:
        - loadData:
            file: db/data/image.csv
            tableName: image
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: file_name
                  type: STRING
              - column:
                  name: title
                  type: STRING
              - column:
                  name: mime_type
                  type: STRING
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: image_data
                  type: BLOB

  - changeSet:
      id: 002-load-tags
      author: system
      changes:
        - loadData:
            file: db/data/tag.csv
            tableName: tag
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: name
                  type: STRING

  - changeSet:
      id: 003-load-pages
      author: system
      changes:
        - loadData:
            tableName: page
            file: db/data/page.csv
            separator: ;
            encoding: UTF-8
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: slug
                  type: STRING
              - column:
                  name: title
                  type: STRING
              - column:
                  name: description
                  type: STRING

  # ── Stage: minimal seed articles and sections ─────────────────────────────

  - changeSet:
      id: 004-load-stage-articles
      author: system
      context: stage
      changes:
        - loadData:
            tableName: article
            file: db/data/article.csv
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: title
                  type: STRING
              - column:
                  name: content
                  type: STRING
              - column:
                  name: state
                  type: STRING
              - column:
                  name: published_date
                  type: datetime
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime
              - column:
                  name: language
                  type: STRING
              - column:
                  name: page_type
                  type: STRING
              - column:
                  name: sort_order
                  type: NUMERIC
              - column:
                  name: page_id
                  type: NUMERIC

  - changeSet:
      id: 005-load-stage-sections
      author: system
      context: stage
      changes:
        - loadData:
            tableName: section
            file: db/data/section.csv
            separator: ;
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: sort_order
                  type: NUMERIC
              - column:
                  name: title
                  type: STRING
              - column:
                  name: content
                  type: STRING
              - column:
                  name: article_id
                  type: NUMERIC

  # ── Dev / faker: rich test articles ──────────────────────────────────────

  - changeSet:
      id: 006-load-fake-articles-de
      author: system
      context: faker
      changes:
