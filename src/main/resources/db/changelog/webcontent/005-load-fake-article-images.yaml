databaseChangeLog:
  - changeSet:
      id: 005-load-fake-article-images
      author: system
      context: faker
      changes:
        - loadData:
            file: db/fake-data/article_image.csv
            tableName: article_images
            separator: ;
            quotchar: '"'
            columns:
              - column:
                  name: article_id
                  type: numeric
              - column:
                  name: image_id
                  type: numeric