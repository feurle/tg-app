databaseChangeLog:
  - changeSet:
      id: 001-create-contact-info-table
      author: system
      changes:
        - createTable:
            tableName: contact_info
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  startWith: 1500
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: city
                  type: VARCHAR(100)
              - column:
                  name: zip
                  type: VARCHAR(20)
              - column:
                  name: updated_at
                  type: TIMESTAMP

  - changeSet:
      id: 002-create-contact-office-hour-table
      author: system
      changes:
        - createTable:
            tableName: contact_office_hour
            columns:
              - column:
                  name: contact_info_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: VARCHAR(255)
              - column:
                  name: hours
                  type: VARCHAR(100)
        - addForeignKeyConstraint:
            baseTableName: contact_office_hour
            baseColumnNames: contact_info_id
            referencedTableName: contact_info
            referencedColumnNames: id
            constraintName: fk_office_hour_contact_info
            onDelete: CASCADE
