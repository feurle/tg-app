databaseChangeLog:
  - changeSet:
      id: 001-create-questionnaire-table
      author: system
      changes:
        - createTable:
            tableName: questionnaire
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  startWith: 1500
                  constraints:
                    primaryKey: true
                    nullable: false
              # --- owner (Fragen zum Hundehalter) ---
              - column:
                  name: owner_name
                  type: VARCHAR(255)
              - column:
                  name: owner_email
                  type: VARCHAR(255)
              - column:
                  name: owner_first_pet
                  type: BOOLEAN
              - column:
                  name: owner_reason_for_choosing
                  type: TEXT
              # --- pet (Allgemeine Fragen zu Ihrem Hund) ---
              - column:
                  name: pet_name
                  type: VARCHAR(255)
              - column:
                  name: pet_origin
                  type: TEXT
              - column:
                  name: pet_breeder_rearing
                  type: TEXT
              - column:
                  name: pet_history_before_owner
                  type: TEXT
              - column:
                  name: pet_age_when_acquired
                  type: VARCHAR(255)
              - column:
                  name: pet_owned_since
                  type: VARCHAR(255)
              - column:
                  name: pet_neutered
                  type: BOOLEAN
              - column:
                  name: pet_neutered_age
                  type: VARCHAR(255)
              - column:
                  name: pet_neutering_reason
                  type: TEXT
              - column:
                  name: pet_behavior_changes_after_neutering
                  type: TEXT
              - column:
                  name: pet_school
                  type: TEXT
              - column:
                  name: pet_known_commands
                  type: TEXT
              - column:
                  name: pet_feeding
                  type: TEXT
              - column:
                  name: pet_supplements
                  type: TEXT
              - column:
                  name: pet_digestion
                  type: TEXT
              - column:
                  name: pet_last_deworming
                  type: VARCHAR(255)
              - column:
                  name: pet_blood_test
                  type: TEXT
              - column:
                  name: submitted_at
                  type: TIMESTAMP
