databaseChangeLog:
  # Spring Modulith's JpaEventPublication uses a UUID primary key (@Id @Column(length = 16) UUID).
  # The id column type must match per database: H2/Postgres have a native UUID type, MySQL/MariaDB
  # store it as BINARY(16) (which is what Hibernate maps the UUID to on those dialects).
  - property:
      name: uuid.type
      value: UUID
      dbms: h2,postgresql
  - property:
      name: uuid.type
      value: BINARY(16)
      dbms: mysql,mariadb
  - changeSet:
      id: 001-create-event-publication-table
      author: system
      changes:
        - createTable:
            tableName: event_publication
            columns:
              - column:
                  name: id
                  type: ${uuid.type}
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: listener_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: completion_date
                  type: TIMESTAMP
              - column:
                  name: serialized_event
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: 'INITIAL'
              - column:
                  name: completion_attempts
                  type: INT
                  defaultValue: 0
              - column:
                  name: last_resubmission_date
                  type: TIMESTAMP
        - createIndex:
            indexName: idx_event_publication_status
            tableName: event_publication
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_event_publication_completion_date
            tableName: event_publication
            columns:
              - column:
                  name: completion_date
