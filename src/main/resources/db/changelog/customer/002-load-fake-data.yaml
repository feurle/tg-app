databaseChangeLog:
  - changeSet:
      id: 001-load-fake-customers
      author: system
      context: faker
      changes:
        - loadData:
            file: db/fake-data/customer.csv
            tableName: customer
            separator: ;
            quotchar: '"'
            columns:
              - column:
                  name: id
                  type: numeric
              - column:
                  name: first_name
                  type: string
              - column:
                  name: last_name
                  type: string
              - column:
                  name: email
                  type: string
              - column:
                  name: phone
                  type: string
              - column:
                  name: address
                  type: string
              - column:
                  name: city
                  type: string
              - column:
                  name: state
                  type: string
              - column:
                  name: zip
                  type: string
              - column:
                  name: country
                  type: string
              - column:
                  name: created_at
                  type: datetime
              - column:
                  name: updated_at
                  type: datetime