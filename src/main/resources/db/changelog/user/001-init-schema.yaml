databaseChangeLog:
  - changeSet:
      id: 001-create-authority-table
      author: system
      changes:
        - createTable:
            tableName: authority
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 002-create-app-user-table
      author: system
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  startWith: 1500
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(50)
              - column:
                  name: last_name
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: activated
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
              - column:
                  name: lang_key
                  type: VARCHAR(6)
                  defaultValue: 'de'
              - column:
                  name: image_url
                  type: VARCHAR(255)
              - column:
                  name: activation_key
                  type: VARCHAR(255)
              - column:
                  name: reset_key
                  type: VARCHAR(255)
              - column:
                  name: reset_date
                  type: TIMESTAMP
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_by
                  type: VARCHAR(50)

  - changeSet:
      id: 003-create-user-authority-table
      author: system
      changes:
        - createTable:
            tableName: user_authority
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_authority_user
                    references: app_user(id)
              - column:
                  name: authority_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_authority_authority
                    references: authority(name)
        - addPrimaryKey:
            tableName: user_authority
            columnNames: user_id,authority_name