databaseChangeLog:
  - changeSet:
      id: 004-load-authorities
      author: system
      changes:
        - loadData:
            tableName: authority
            file: db/data/authority.csv
            separator: ','
            encoding: UTF-8
            relativeToChangelogFile: false

  - changeSet:
      id: 005-load-users
      author: system
      changes:
        - loadData:
            tableName: app_user
            file: db/data/user.csv
            separator: ';'
            encoding: UTF-8
            relativeToChangelogFile: false
            columns:
              - column:
                  name: id
                  type: NUMERIC
              - column:
                  name: login
                  type: STRING
              - column:
                  name: password
                  type: STRING
              - column:
                  name: first_name
                  type: STRING
              - column:
                  name: last_name
                  type: STRING
              - column:
                  name: email
                  type: STRING
              - column:
                  name: image_url
                  type: STRING
              - column:
                  name: activated
                  type: BOOLEAN
              - column:
                  name: lang_key
                  type: STRING
              - column:
                  name: created_by
                  type: STRING
              - column:
                  name: last_modified_by
                  type: STRING
              - column:
                  name: created_date
                  type: TIMESTAMP
              - column:
                  name: last_modified_date
                  type: TIMESTAMP

  - changeSet:
      id: 006-load-user-authorities
      author: system
      changes:
        - loadData:
            tableName: user_authority
            file: db/data/user_authority.csv
            separator: ';'
            encoding: UTF-8
            relativeToChangelogFile: false
            columns:
              - column:
                  name: user_id
                  type: NUMERIC
              - column:
                  name: authority_name
                  type: STRING
