services:
  tg-app:
    image: feurle/tg-app:latest
    container_name: tg-app
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      tg-database:
        condition: service_healthy
    networks:
      - tg-app-network

  tg-web:
    image: feurle/tg-web:latest
    container_name: tg-web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://tg-app:8080
      - VIRTUAL_HOST=www.domain.tld
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=www.domain.tld
    depends_on:
      tg-app:
        condition: service_started
    networks:
      - tg-app-network

  tg-database:
    image: mysql:9.2.0
    container_name: tg-database
    volumes:
      - tg-db_data:/var/lib/mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=tg-app
    command: mysqld --lower_case_table_names=1 --skip-mysqlx --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - tg-app-network

networks:
  tg-app-network:
    external: true

volumes:
  tg-db_data: