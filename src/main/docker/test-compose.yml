services:
  tg-app-test:
    image: feurle/tg-app:latest
    container_name: tg-app-test
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - DB_HOST=tg-database
      - DB_NAME=tg-database-test
    networks:
      - nginx-proxy-network

  tg-web-test:
    image: feurle/tg-web:latest
    container_name: tg-web-test
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://tg-app-test:8080
      - VIRTUAL_HOST=test.example.com
      - LETSENCRYPT_HOST=test.example.com
    networks:
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    external: true