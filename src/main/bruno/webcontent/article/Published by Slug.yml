info:
  name: Published by Slug
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/webcontent/articles/page/{{slug}}/published"
  auth: inherit

runtime:
  variables:
    - name: slug
      value: home
    - name: slug
      value: news
      disabled: true
    - name: slug
      value: about
      disabled: true
    - name: slug
      value: imprint
      disabled: true
    - name: slug
      value: privacy
      disabled: true
    - name: slug
      value: contact
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
