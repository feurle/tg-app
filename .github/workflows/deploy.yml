name: Build & Deploy

on:
  push:
    branches:
      - trunk
      - 'feature/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tg-app

jobs:
# ─────────────────────────────────────────
# JOB 1: Tests & Build
# ─────────────────────────────────────────
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Build and Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew test bootJar sonar

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/
        if: always()

  # ─────────────────────────────────────────
  # JOB 2: Docker Image bauen & pushen
  # ─────────────────────────────────────────
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Determine Image Tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/trunk" ]; then
            echo "value=latest" >> $GITHUB_OUTPUT
          else
            echo "value=snapshot" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Docker Image (Gradle bootBuildImage)
        run: |
          ./gradlew bootBuildImage --imageName=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          docker push ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}

          if [ "${{ steps.tag.outputs.value }}" = "latest" ]; then
            docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            docker push ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          fi

  # ─────────────────────────────────────────
  # JOB 3: Deploy auf den Server
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose files to server
        run: |
          scp src/main/docker/prod-compose.yml \
              src/main/docker/test-compose.yml \
              src/main/docker/services.yml \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/appbase/tg-app/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image-tag }}

            if [ "${{ needs.docker.outputs.image-tag }}" = "latest" ]; then
              docker compose -f /appbase/tg-app/prod-compose.yml up tg-app -d

              docker compose -f /appbase/tg-app/test-compose.yml up tg-app-test -d
            else
              docker compose -f /appbase/tg-app/test-compose.yml up tg-app-test -d
            fi

            docker image prune -f

      - name: Health Check
        run: |
          if [ "${{ needs.docker.outputs.image-tag }}" = "latest" ]; then
            VIRTUAL_HOST=${{ secrets.VIRTUAL_HOST_PROD }}
          else
            VIRTUAL_HOST=${{ secrets.VIRTUAL_HOST_TEST }}
          fi
          echo "Warte 60s auf Spring Boot Start..."
          sleep 60
          curl --fail --retry 5 --retry-delay 10 \
            https://${VIRTUAL_HOST}/actuator/health
