name: Build & Deploy

on:
  push:
    branches:
      - trunk

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tg-app

jobs:
# ─────────────────────────────────────────
# JOB 1: Tests & Build
# ─────────────────────────────────────────
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Run Tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar