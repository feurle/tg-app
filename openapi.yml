openapi: 3.0.3
info:
  title: Tiergesund TG-App API
  description: API for Animal Health Management System
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development Server
  - url: https://api.tiergesund.de
    description: Production Server

tags:
  - name: Customers
    description: Customer management endpoints

paths:
  /api/customer:
    get:
      tags:
        - Customers
      summary: Get all customers
      description: Retrieve a list of all customers
      operationId: getAllCustomers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'
        '500':
          description: Internal server error

    post:
      tags:
        - Customers
      summary: Create a new customer
      description: Create a new customer with the provided information
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid input
        '500':
          description: Internal server error

  /api/customer/{id}:
    get:
      tags:
        - Customers
      summary: Get customer by ID
      description: Retrieve a specific customer by their ID
      operationId: getCustomerById
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          description: Customer not found
        '500':
          description: Internal server error

    put:
      tags:
        - Customers
      summary: Update a customer
      description: Update an existing customer with new information
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid input
        '404':
          description: Customer not found
        '500':
          description: Internal server error

    delete:
      tags:
        - Customers
      summary: Delete a customer
      description: Delete an existing customer by ID
      operationId: deleteCustomer
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Customer deleted successfully
        '404':
          description: Customer not found
        '500':
          description: Internal server error

  /api/customer/email/{email}:
    get:
      tags:
        - Customers
      summary: Get customer by email
      description: Retrieve a customer by their email address
      operationId: getCustomerByEmail
      parameters:
        - name: email
          in: path
          required: true
          description: Customer email address
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          description: Customer not found
        '500':
          description: Internal server error

components:
  schemas:
    CustomerResponse:
      type: object
      description: Complete customer information
      properties:
        id:
          type: integer
          format: int64
          description: Unique customer identifier
          example: 1
        firstName:
          type: string
          description: Customer's first name
          example: "Hans"
        lastName:
          type: string
          description: Customer's last name
          example: "Müller"
        email:
          type: string
          format: email
          description: Customer's email address
          example: "hans.mueller@example.com"
        phone:
          type: string
          description: Customer's phone number
          example: "+49 30 12345678"
        address:
          type: string
          description: Street address
          example: "Hauptstraße 123"
        city:
          type: string
          description: City
          example: "Berlin"
        state:
          type: string
          description: State/Province
          example: "Berlin"
        zip:
          type: string
          description: Postal code
          example: "10115"
        country:
          type: string
          description: Country
          example: "Germany"
        createdAt:
          type: string
          format: date-time
          description: Customer creation timestamp
          example: "2026-03-05T10:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Customer last update timestamp
          example: "2026-03-05T10:30:00"
      required:
        - id
        - firstName
        - lastName
        - email
        - createdAt
        - updatedAt

    CreateCustomerRequest:
      type: object
      description: Request payload to create a new customer
      properties:
        firstName:
          type: string
          description: Customer's first name
          example: "Hans"
        lastName:
          type: string
          description: Customer's last name
          example: "Müller"
        email:
          type: string
          format: email
          description: Customer's email address
          example: "hans.mueller@example.com"
        phone:
          type: string
          description: Customer's phone number
          example: "+49 30 12345678"
        address:
          type: string
          description: Street address
          example: "Hauptstraße 123"
        city:
          type: string
          description: City
          example: "Berlin"
        state:
          type: string
          description: State/Province
          example: "Berlin"
        zip:
          type: string
          description: Postal code
          example: "10115"
        country:
          type: string
          description: Country
          example: "Germany"
      required:
        - firstName
        - lastName
        - email

    UpdateCustomerRequest:
      type: object
      description: Request payload to update an existing customer
      properties:
        firstName:
          type: string
          description: Customer's first name
          example: "Hans"
        lastName:
          type: string
          description: Customer's last name
          example: "Müller"
        email:
          type: string
          format: email
          description: Customer's email address
          example: "hans.mueller@example.com"
        phone:
          type: string
          description: Customer's phone number
          example: "+49 30 12345678"
        address:
          type: string
          description: Street address
          example: "Hauptstraße 123"
        city:
          type: string
          description: City
          example: "Berlin"
        state:
          type: string
          description: State/Province
          example: "Berlin"
        zip:
          type: string
          description: Postal code
          example: "10115"
        country:
          type: string
          description: Country
          example: "Germany"