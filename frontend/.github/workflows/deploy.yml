name: Build & Deploy

on:
  push:
    branches:
      - trunk
      - 'feature/**'
      - 'feat/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Tests & Build
  # ─────────────────────────────────────────
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Type-check & Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2: Docker Image bauen & pushen
  # ─────────────────────────────────────────
  docker:
    name: Build & Push Image
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Image Tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/trunk" ]; then
            echo "value=latest" >> $GITHUB_OUTPUT
          else
            echo "value=snapshot" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-to: type=inline

      - name: Tag with SHA (trunk only)
        if: github.ref == 'refs/heads/trunk'
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 3a: Deploy to Test (feature branches)
  # ─────────────────────────────────────────
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref != 'refs/heads/trunk'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker pull ${{ env.IMAGE_NAME }}:snapshot
            docker compose -f /appbase/tg-app/test-compose.yml up tg-web-test -d
            docker image prune -f

      - name: Health Check
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            https://${{ secrets.VIRTUAL_HOST_TEST_WEB }}

  # ─────────────────────────────────────────
  # JOB 3b: Deploy to Production (trunk)
  # ─────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/trunk'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker compose -f /appbase/tg-app/prod-compose.yml up tg-web-prod -d
            docker image prune -f

      - name: Health Check
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            https://${{ secrets.VIRTUAL_HOST_PROD_WEB }}
